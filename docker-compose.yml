services:
  la-memoria-next:
    container_name: la-memoria-next
    restart: always
    image: node:20.10.0
    ports:
      - 7077:6077
    environment:
      - PORT=6077

    volumes:
      - ./:/usr/src/la-memoria-next
    working_dir: /usr/src/la-memoria-next

    networks:
      - client-network

    # FOR PRODUCTION
    command: bash -c "yarn && yarn run build && yarn run start"

networks:
  client-network:
    driver: bridge
